[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jailbreak"
version = "0.1.0"
description = "Autonomous jailbreak-research loop (Rainbow Teaming + navigator seed) for authorized AI red-team research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ugo.vollmer" }]
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastembed>=0.4.0",
    "numpy>=1.26",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
jb = "jailbreak.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jailbreak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
